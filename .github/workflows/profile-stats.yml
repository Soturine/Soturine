name: Update profile statistics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"
      - "scripts/generate_profile_stats.py"
      - "scripts/profile_stats_seed.json"

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate self-hosted statistics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_stats.py

      - name: Commit refreshed cards
        shell: bash
        run: |
          if git diff --quiet -- assets/stats; then
            echo "Statistics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          git commit -m "chore: refresh profile statistics"
          git push
